<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Radar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>ESP32 RADAR SYSTEM</h1>
  <div id="ws-status">⬤ CONNECTING...</div>

  <div id="canvas-container">
    <canvas id="radarCanvas" width="1200" height="700"></canvas>
  </div>

  <div id="info">
    <div>Angle: <span id="_ANGLE">—</span>°</div>
    <div>Dist:  <span id="_CM">—</span> cm</div>
    <div id="alert-box"></div>
  </div>

<script>
const canvas = document.getElementById("radarCanvas");
const ctx    = canvas.getContext("2d");

const MAX_DIST_CM   = 40;
const ANGLE_MIN     = 15;
const ANGLE_MAX     = 165;
const STEP_MS       = 50;          // повинен збігатися з servoStepPeriodMs
const OBSTACLE_CM   = 35;
const HOLD_FRAMES   = 60;          // ~1с при 60fps

// ── стан ──
let baseAngle     = 90;
let baseDir       = 1;
let espBaseTms    = 0;
let espToPcOffset = 0;

// плавний sweep (lerp)
let displayAngle  = 90;

// trail: масив останніх кутів з alpha
const TRAIL_LEN = 18;
const trail = [];

// детекції
const detDist   = new Array(181).fill(null);
const detHold   = new Array(181).fill(0);
const detAlpha  = new Array(181).fill(0);

// WS
const gateway = `ws://${window.location.hostname}/ws`;
let ws, lastMsg = null;
const statusEl   = document.getElementById("ws-status");
const alertEl    = document.getElementById("alert-box");

function connectWS() {
  ws = new WebSocket(gateway);
  ws.onopen    = () => { statusEl.textContent = "⬤ CONNECTED";  statusEl.style.color = "#62f51f"; };
  ws.onclose   = () => { statusEl.textContent = "⬤ OFFLINE";    statusEl.style.color = "#f00"; setTimeout(connectWS, 800); };
  ws.onmessage = (e) => { lastMsg = e.data; };
}

function applyLastMsg() {
  if (!lastMsg) return;
  const raw = lastMsg; lastMsg = null;

  let data;
  try { data = JSON.parse(raw); } catch { return; }

  const a   = data.a   ?? data.angle    ?? baseAngle;
  const d   = data.d   ?? data.distance ?? 999;
  const dir = data.dir ?? 1;
  const t   = data.t   ?? data.tms      ?? 0;

  baseAngle = a;
  baseDir   = dir;

  // синхронізація часу (EWMA)
  espBaseTms = t;
  const raw_offset = performance.now() - t;
  espToPcOffset = espToPcOffset
    ? espToPcOffset * 0.9 + raw_offset * 0.1
    : raw_offset;

  document.getElementById("_ANGLE").textContent = a;
  document.getElementById("_CM").textContent    = d < 999 ? d : "—";

  // зберегти детекцію
  if (d > 0 && d < MAX_DIST_CM) {
    const ang = Math.max(0, Math.min(180, Math.round(a)));
    detDist[ang]  = d;
    detHold[ang]  = HOLD_FRAMES;
    detAlpha[ang] = 1.0;

    // UI alert
    if (d < OBSTACLE_CM) {
      alertEl.textContent = `⚠ OBSTACLE at ${d} cm`;
      alertEl.style.color = "#f55";
    } else {
      alertEl.textContent = "";
    }
  }
}

// передбачуваний кут з інтерполяцією
function predictedAngle() {
  const estEsp = performance.now() - espToPcOffset;
  const elapsed = estEsp - espBaseTms;
  let a = baseAngle + baseDir * (elapsed / STEP_MS);
  return Math.max(ANGLE_MIN, Math.min(ANGLE_MAX, a));
}

// ── малювання ──
function toXY(angleDeg, radiusPx) {
  const r = angleDeg * Math.PI / 180;
  return [radiusPx * Math.cos(r), -radiusPx * Math.sin(r)];
}

const CW = canvas.width;
const CH = canvas.height;
const ORIGIN_Y   = CH - CH * 0.074;
const MAX_RADIUS = (CW / 2) - 10;

// радіус для дистанції в пікселях
function distToPx(cm) {
  return cm * (MAX_RADIUS / MAX_DIST_CM);
}

function drawGrid() {
  ctx.strokeStyle = "rgba(98,245,31,0.55)";
  ctx.lineWidth   = 1.2;

  // кільця через 10 см
  for (let d = 10; d <= MAX_DIST_CM; d += 10) {
    const r = distToPx(d);
    ctx.beginPath();
    ctx.arc(0, 0, r, Math.PI, 2 * Math.PI);
    ctx.stroke();
  }

  // промені через 30°
  for (let a = 30; a <= 150; a += 30) {
    const [x, y] = toXY(a, MAX_RADIUS);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  // підписи кілець
  ctx.fillStyle = "rgba(98,245,31,0.7)";
  ctx.font = "bold 14px 'Courier New', monospace";
  ctx.textAlign = "center";
  for (let d = 10; d <= MAX_DIST_CM; d += 10) {
    const r = distToPx(d);
    ctx.fillText(`${d}cm`, -r - 6, 16);
  }

  // підписи кутів
  ctx.font = "13px 'Courier New', monospace";
  for (const a of [30, 60, 90, 120, 150]) {
    const [x, y] = toXY(a, MAX_RADIUS + 18);
    ctx.fillText(`${a}°`, x, y + 5);
  }
}

function drawDetections() {
  for (let ang = 0; ang <= 180; ang++) {
    if (detHold[ang] > 0) {
      detHold[ang]--;
      // плавне затухання в останніх 20 кадрах
      if (detHold[ang] < 20) {
        detAlpha[ang] = detHold[ang] / 20;
      }
    }

    if (!detDist[ang] || detHold[ang] <= 0) {
      detDist[ang] = null;
      continue;
    }

    const d = detDist[ang];
    const px = distToPx(d);
    const seg = 14;

    const [x1, y1] = toXY(ang, px - seg);
    const [x2, y2] = toXY(ang, px + seg);

    ctx.save();
    ctx.globalAlpha = detAlpha[ang];
    ctx.strokeStyle = d < OBSTACLE_CM ? "#ff2222" : "#ff6633";
    ctx.lineWidth   = d < OBSTACLE_CM ? 22 : 16;
    ctx.shadowColor = d < OBSTACLE_CM ? "#ff0000" : "#ff4400";
    ctx.shadowBlur  = 12;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawSweepBeam(angle) {
  // оновити trail
  trail.push(angle);
  if (trail.length > TRAIL_LEN) trail.shift();

  // намалювати trail (згасаючий слід)
  for (let i = 0; i < trail.length; i++) {
    const a = trail[i] * Math.PI / 180;
    const alpha = (i / trail.length) * 0.25;
    const len   = MAX_RADIUS;

    ctx.save();
    ctx.globalAlpha  = alpha;
    ctx.strokeStyle  = "rgb(30,250,60)";
    ctx.lineWidth    = 8 + (i / trail.length) * 4;
    ctx.shadowColor  = "#00ff44";
    ctx.shadowBlur   = 10; // 18
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(len * Math.cos(a), -len * Math.sin(a));
    ctx.stroke();
    ctx.restore();
  }

  // основний промінь
  const rad = angle * Math.PI / 180;
  const len  = MAX_RADIUS;

  ctx.save();
  ctx.globalAlpha = 1.0;
  ctx.lineWidth   = 3;
  ctx.strokeStyle = "rgb(98,245,31)";
  ctx.shadowColor = "#62f51f";
  ctx.shadowBlur  = 14; //14
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(len * Math.cos(rad), -len * Math.sin(rad));
  ctx.stroke();
  ctx.restore();
}

function drawFrame(angle) {
  // темний fade замість повного очищення → лишає слід
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.fillRect(0, 0, CW, CH);

  ctx.save();
  ctx.translate(CW / 2, ORIGIN_Y);

  drawGrid();
  drawDetections();
  drawSweepBeam(angle);

  ctx.restore();
}

function animate() {
  applyLastMsg();

  // lerp displayAngle до predicted — плавний рух без стрибків
  const target = predictedAngle();
  const diff   = target - displayAngle;
  // якщо стрибок > 5° (реверс або великий gap) — snap одразу
  if (Math.abs(diff) > 8) {
    displayAngle = target;
  } else {
    displayAngle += diff * 0.35;
  }

  drawFrame(displayAngle);
  requestAnimationFrame(animate);
}

// старт
ctx.fillStyle = "black";
ctx.fillRect(0, 0, CW, CH);

window.onload = () => {
  connectWS();
  requestAnimationFrame(animate);
};
</script>
</body>
</html>
